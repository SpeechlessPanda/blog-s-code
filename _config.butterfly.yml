# hexo-theme-butterfly 主题配置覆盖
# 与 themes/butterfly/_config.yml 深度合并（hexo 5+ 原生支持 _config.<theme>.yml），
# 这里只放需要覆盖的少量字段，不动主题文件本身，便于主题升级。

inject:
  # 页面底部注入的脚本：让文章正文与碎碎念里的链接在新标签页打开
  bottom:
    - <script src="/js/fix-link-target.js"></script>

aside:
  display:
    # /blog/ 文章流（原首页）不显示右侧栏
    home: false
    archive: false
    tag: false
    category: false
  # 分类功能已停用，侧栏不再展示分类卡片
  card_categories:
    enable: false
