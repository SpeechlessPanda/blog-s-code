# 站点个性化配置(覆盖 themes/butterfly/_config.yml)
# Hexo 5+ 原生支持:运行时与本文件深合并,本文件优先。主题文件保持官方默认,可整体替换升级。

# 导航栏
nav:
  fixed: true # 固定导航栏

# 菜单
menu:
  首页: / || fas fa-home
  博客: /blog/ || fas fa-feather-alt
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  碎碎念: /memos/ || fas fa-comment-dots

# 代码块
code_blocks:
  theme: darker
  macStyle: true
  height_limit: 320
  word_wrap: true

# 社交链接(头像下方)
social:
  fab fa-github: https://github.com/SpeechlessPanda || GitHub || '#ffffff'
  fas fa-envelope: mailto:zhoushimingyu@qq.com || Email || '#4a7dbe'
  fas fa-rss: /atom.xml || RSS || '#ff6600'

# 头像
avatar:
  img: /img/avatar.png
  effect: true # 旋转动画（inject 中覆盖 .avatar-img 的动画时长）

# 副标题(打字机轮播)
subtitle:
  enable: true
  sub:
    - 保持思考，保持努力，这是本博客唯一不变的正确，也应该是你对本博客的原则。
    - 世界上有难的内容，但大多是新的内容，只要去学，就不难。
    - 做自己，接受自己，成为自己。
    - 人生的容错很高，三次右转就变成了左转。
    - 不要失去从头再来的勇气。

# 打赏
reward:
  enable: true
  text: 请我喝杯咖啡~
  QR_code:
    - img: /img/wechat.png
      link:
      text: 微信
    - img: /img/alipay.png
      link:
      text: 支付宝

# 侧栏
aside:
  display:
    home: false
    archive: false
    tag: false
    category: false
  card_author:
    description: 主要分享我的个人成长心得，偶尔可能会分享一些技术文章，欢迎关注~（右上角有碎碎念可以看）
    button:
      link: https://github.com/SpeechlessPanda
  card_announcement:
    content: 我是一名计算机学生，这里是我向外输出内容的地方，如果你看了本博客之后有想和我交流的内容，欢迎在文章下方留言或者通过邮箱联系我~大家还可以多多关注友链里的内容，不仅有各种大佬，还有很多有用的资源。
  card_categories:
    enable: false

# 深色模式
darkmode:
  autoChangeMode: 1 # 跟随系统深色模式；不支持时按主题设定时间切换

# 阅读进度百分比
rightside_scroll_percent: true

# 字数统计
wordcount:
  enable: true

# 数学公式
math:
  use: katex

# 搜索
search:
  use: local_search

# 评论
comments:
  use: Giscus
  count: true
  card_post_count: true

giscus:
  repo: SpeechlessPanda/SpeechlessPanda.github.io
  repo_id: R_kgDORZHPlQ
  category_id: DIC_kwDORZHPlc4C3cyf
  js: https://giscus.app/client.js
  option:
    data-mapping: pathname
    data-strict: '0'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: top
    data-lang: zh-CN

# 加载动画
preloader:
  enable: true

# 美化(标题前缀图标等)
beautify:
  enable: true
  title_prefix_icon: '\f863'
  title_prefix_icon_color: '#6ec6ff'

# 字体
font:
  global_font_size: 1.1em
  font_family: "'LXGW WenKai','Source Han Serif SC','Noto Serif SC','PingFang SC','Microsoft YaHei',serif"
  code_font_family: "'LXGW WenKai','Sarasa Mono SC','JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace"

blog_title_font:
  font_family: "'LXGW WenKai','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"

# 图片灯箱
lightbox: fancybox

# Pjax(碎碎念页除外,其 Giscus 多 iframe 与 PJAX 不兼容)
pjax:
  enable: true
  exclude:
    - /memos/
    - /memos/index.html

# 预加载
instantpage: true

# 图片懒加载
lazyload:
  enable: true

# Open Graph
Open_Graph_meta:
  option:
    twitter_card: summary_large_image

# 注入
inject:
  head:
    - |
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" media="print" onload="this.media='all'">
      <style>
        #page-header.full_page {
          background-image: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
          background-size: cover;
          background-position: center;
        }

        #page-header.post-bg {
          background-image: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
          background-size: cover;
          background-position: center;
        }

        #page-header.not-home-page {
          background-image: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
          background-size: cover;
          background-position: center;
        }

        #page-header.not-top-img {
          background: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
        }

        #page-header.full_page:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #page-header.post-bg:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #page-header.not-home-page:before,
        #page-header.not-top-img:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #web_bg {
          background: linear-gradient(180deg, #f3f9ff 0%, #edf2ff 55%, #fff8f3 100%);
        }

        #page-header.full_page #site-title,
        #page-header.full_page #site-subtitle,
        #page-header.full_page #subtitle,
        #page-header.post-bg #post-info .post-title,
        #page-header.post-bg #post-meta,
        #page-header.post-bg #post-meta a,
        #page-header.nav-fixed #nav a,
        #page-header #nav .site-page,
        #page-header #nav .menus_item_child li a {
          color: #ffffff !important;
          text-shadow: 0 2px 12px rgba(28, 58, 92, 0.38);
        }

        #page-header.not-top-img #nav .site-page,
        #page-header.not-top-img #nav #toggle-menu,
        #page-header.not-top-img #nav #search-button,
        #page-header.not-top-img #nav #nav-right div,
        #page-header.not-top-img #nav .menus_item_child li a {
          color: #ffffff !important;
        }

        #page-header.nav-fixed #nav {
          background: linear-gradient(135deg, rgba(79, 172, 254, 0.96) 0%, rgba(161, 140, 209, 0.96) 55%, rgba(255, 210, 168, 0.96) 100%) !important;
          box-shadow: 0 8px 20px rgba(38, 79, 126, 0.2) !important;
          backdrop-filter: saturate(130%) blur(6px);
          -webkit-backdrop-filter: saturate(130%) blur(6px);
        }

        #page-header.nav-fixed #nav a,
        #page-header.nav-fixed #nav .site-page,
        #page-header.nav-fixed #nav .site-name,
        #page-header.nav-fixed #nav #toggle-menu,
        #page-header.nav-fixed #nav #search-button,
        #page-header.nav-fixed #nav #nav-right div,
        #page-header.nav-fixed #nav .menus_item_child li a {
          color: #ffffff !important;
          text-shadow: 0 2px 12px rgba(28, 58, 92, 0.38);
        }

        #page-header.not-top-img.nav-fixed #nav {
          background: linear-gradient(135deg, rgba(79, 172, 254, 0.96) 0%, rgba(161, 140, 209, 0.96) 55%, rgba(255, 210, 168, 0.96) 100%) !important;
          box-shadow: 0 8px 20px rgba(38, 79, 126, 0.2) !important;
          backdrop-filter: saturate(130%) blur(6px);
          -webkit-backdrop-filter: saturate(130%) blur(6px);
        }

        [data-theme='dark'] #page-header.full_page {
          background-image: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] #page-header.post-bg {
          background-image: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] #page-header.not-home-page {
          background-image: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] #page-header.not-top-img {
          background: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] #page-header.full_page:before {
          background: linear-gradient(180deg, rgba(6, 12, 24, 0.2) 0%, rgba(6, 12, 24, 0.38) 100%) !important;
        }

        [data-theme='dark'] #page-header.post-bg:before {
          background: linear-gradient(180deg, rgba(6, 12, 24, 0.2) 0%, rgba(6, 12, 24, 0.38) 100%) !important;
        }

        [data-theme='dark'] #page-header.not-home-page:before,
        [data-theme='dark'] #page-header.not-top-img:before {
          background: linear-gradient(180deg, rgba(6, 12, 24, 0.2) 0%, rgba(6, 12, 24, 0.38) 100%) !important;
        }

        [data-theme='dark'] #web_bg {
          background: linear-gradient(180deg, #0a0a1a 0%, #11132e 55%, #1a1529 100%);
        }

        [data-theme='dark'] #page-header.full_page #site-title,
        [data-theme='dark'] #page-header.full_page #site-subtitle,
        [data-theme='dark'] #page-header.full_page #subtitle,
        [data-theme='dark'] #page-header.post-bg #post-info .post-title,
        [data-theme='dark'] #page-header.post-bg #post-meta,
        [data-theme='dark'] #page-header.post-bg #post-meta a,
        [data-theme='dark'] #page-header.nav-fixed #nav a,
        [data-theme='dark'] #page-header #nav .site-page,
        [data-theme='dark'] #page-header #nav .menus_item_child li a {
          color: #eaf4ff !important;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.42);
        }

        [data-theme='dark'] #page-header.not-top-img #nav .site-page,
        [data-theme='dark'] #page-header.not-top-img #nav #toggle-menu,
        [data-theme='dark'] #page-header.not-top-img #nav #search-button,
        [data-theme='dark'] #page-header.not-top-img #nav #nav-right div,
        [data-theme='dark'] #page-header.not-top-img #nav .menus_item_child li a {
          color: #eaf4ff !important;
        }

        [data-theme='dark'] #page-header.nav-fixed #nav {
          background: linear-gradient(135deg, rgba(2, 0, 36, 0.96) 0%, rgba(26, 36, 64, 0.96) 50%, rgba(157, 78, 221, 0.96) 100%) !important;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35) !important;
          backdrop-filter: saturate(120%) blur(6px);
          -webkit-backdrop-filter: saturate(120%) blur(6px);
        }

        [data-theme='dark'] #page-header.nav-fixed #nav a,
        [data-theme='dark'] #page-header.nav-fixed #nav .site-page,
        [data-theme='dark'] #page-header.nav-fixed #nav .site-name,
        [data-theme='dark'] #page-header.nav-fixed #nav #toggle-menu,
        [data-theme='dark'] #page-header.nav-fixed #nav #search-button,
        [data-theme='dark'] #page-header.nav-fixed #nav #nav-right div,
        [data-theme='dark'] #page-header.nav-fixed #nav .menus_item_child li a {
          color: #eaf4ff !important;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.42);
        }

        [data-theme='dark'] #page-header.not-top-img.nav-fixed #nav {
          background: linear-gradient(135deg, rgba(2, 0, 36, 0.96) 0%, rgba(26, 36, 64, 0.96) 50%, rgba(157, 78, 221, 0.96) 100%) !important;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35) !important;
          backdrop-filter: saturate(120%) blur(6px);
          -webkit-backdrop-filter: saturate(120%) blur(6px);
        }

        .read-mode #page-header.post-bg {
          background-image: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
          background-size: cover !important;
          background-position: center !important;
        }

        .read-mode #page-header.post-bg:before {
          opacity: 1 !important;
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        [data-theme='dark'] .read-mode #page-header.post-bg {
          background-image: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] .read-mode #page-header.post-bg:before {
          opacity: 1 !important;
          background: linear-gradient(180deg, rgba(6, 12, 24, 0.2) 0%, rgba(6, 12, 24, 0.38) 100%) !important;
        }

        #footer {
          background: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
        }

        #footer::before {
          background: rgba(255, 255, 255, 0.1) !important;
        }

        #footer-wrap,
        #footer-wrap a {
          color: #eaf6ff !important;
        }

        [data-theme='dark'] #footer {
          background: linear-gradient(135deg, #020024 0%, #090979 25%, #1a2440 50%, #5b425d 75%, #9d4edd 100%) !important;
        }

        [data-theme='dark'] #footer::before {
          background: rgba(0, 0, 0, 0.24) !important;
        }

        [data-theme='dark'] #footer-wrap,
        [data-theme='dark'] #footer-wrap a {
          color: #d8e9f7 !important;
        }

        .avatar-img {
          animation: avatar_turn_around 8s linear infinite !important;
        }

        /* Only enlarge article body text on post pages */
        #post #article-container {
          font-size: 1.15em;
        }

        /* Fix X/Twitter share icon visibility */
        .social-share .icon-x {
          color: #ffffff !important;
          border-color: rgba(255, 255, 255, 0.85) !important;
        }
        .social-share .icon-x:hover {
          background: #000000 !important;
          color: #ffffff !important;
        }
        [data-theme='dark'] .social-share .icon-x {
          color: #ffffff !important;
          border-color: rgba(255, 255, 255, 0.7) !important;
        }
        [data-theme='dark'] .social-share .icon-x:hover {
          background: rgba(255, 255, 255, 0.9) !important;
          color: #000000 !important;
        }
      </style>
    - <link rel="alternate" type="application/atom+xml" title="SpeechlessPanda" href="/atom.xml">
  bottom:
    - <script src="/js/fix-link-target.js"></script>
