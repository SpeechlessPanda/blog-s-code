name: Deploy Blog From Source

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # 由发布仓的 comment-email-notify 在收到新评论时触发,
  # 让构建重新查询 Giscus discussions,刷新碎碎念/文章的 commentCount(评论区自动展开)。
  repository_dispatch:
    types: [rebuild-on-comment]

jobs:
  deploy:
    if: github.repository != 'SpeechlessPanda/SpeechlessPanda.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          # 需要完整历史，供下一步按 git 提交时间恢复文件 mtime
          fetch-depth: 0

      # checkout 会把所有文件 mtime 设为 checkout 时间，导致 Hexo(updated_option: mtime)
      # 把每篇文章的 updated 都当成构建时间。主题 feed 生成器的"旧文更新推送"
      # 依赖真实的 updated，这里按每个文件最后一次提交时间恢复 mtime。
      - name: Restore file mtimes from git history
        shell: bash
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            [ -n "$t" ] && touch -d "@$t" "$f"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 26：2026-10-28 起为 Active LTS（此前为 Current）。
          # 选它而非 24 的理由：24 已于 2026-10-20 转入 Maintenance（只修关键缺陷），
          # 26 是新 LTS 线且 EOL 到 2029-04；22 为旧维护线。
          # 注意这里指定的是「构建用的 Node」，与 action 自身 runtime 无关。
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache OG image fonts
        uses: actions/cache@v6
        with:
          path: fonts
          key: og-fonts-${{ hashFiles('_config.yml') }}

      - name: Build static site
        env:
          GH_DISCUSSION_TOKEN: ${{ secrets.GH_DISCUSSION_TOKEN }}
        run: pnpm run build
      - name: Verify atom feed identity
        # atom.xml 条目身份标识校验（link/id 唯一性、碎碎念路径式地址），失败即中断部署
        run: node tools/verify-feed.js


      - name: Sync README to publish directory
        shell: bash
        run: |
          if [[ -f README.md ]]; then
            cp README.md public/README.md
            echo "[readme-sync] Synced README.md to public/README.md"
          else
            echo "::warning::[readme-sync] Missing README.md in repository root"
          fi

      - name: Deploy to GitHub Pages repository
        # 锁定到 v4.1.0（浮动 v4 tag 实际也指向它，但显式写出版本可避免
        # 未来 tag 漂移）。v4.1.0 已是 node24 runtime；更早的 v4.0.0 是 node20，
        # 会触发 GitHub 弃用警告。该action 依赖 git config 中的 personal_token
        # 推送，与 checkout v6+ 的凭证隔离($RUNNER_TEMP)配合需保持 git 可用。
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: SpeechlessPanda/SpeechlessPanda.github.io
          publish_branch: main
          publish_dir: ./public
          # 默认 exclude_assets=.github 会丢掉 public/.github/workflows;改为空,
          # 让 sync 脚本同步过来的 comment-email-notify / search-engine-ping 真正进发布仓激活
          # (它们都用 if: github.repository=='SpeechlessPanda/SpeechlessPanda.github.io' 守卫,只在发布仓跑)。
          exclude_assets: ""
          enable_jekyll: false
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      # 部署 ≠ 上线。上面这步只负责把产物 push 到发布仓,真正生效要看发布仓里
      # GitHub 托管的 "pages build and deployment"(动态 workflow,文件不在 .github/workflows 里)。
      # 它会因上一次部署残留的 in-progress 锁而在创建部署时被 400 拒绝,
      # 此时源仓 workflow 依旧显示 success、站点却静默停在旧版本(2026-11-01 新增友链踩过)。
      # 本步骤轮询发布仓的构建结果,把静默失败变成响亮失败。
      - name: Verify Pages deployment
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          PUBLISH_REPO: SpeechlessPanda/SpeechlessPanda.github.io
          PUBLISH_BRANCH: main
        run: |
          set -uo pipefail

          # 优先用 PAT 读;PAT 若缺 Pages 读权限则退回匿名只读(发布仓是公开的)。
          api_get() {
            local p="$1" out
            out=$(gh api "repos/$PUBLISH_REPO/$p" 2>/dev/null) || out=""
            if [ -z "$out" ]; then
              out=$(curl -sS -m 15 -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$PUBLISH_REPO/$p" 2>/dev/null) || out=""
            fi
            printf '%s' "$out"
          }

          TARGET=$(api_get "commits/$PUBLISH_BRANCH" | jq -r '.sha // ""' 2>/dev/null)
          if [ -z "$TARGET" ]; then
            echo "::error::[pages-verify] 读不到发布仓 $PUBLISH_REPO 的 $PUBLISH_BRANCH HEAD"
            exit 1
          fi
          echo "[pages-verify] 目标提交 ${TARGET:0:8},开始轮询发布仓 Pages 构建…"

          # 实测正常构建 p50≈23s / p90≈42s,给到 300s 已是近 7 倍余量;
          # 真卡死(如 in-progress 锁)则永远不会完成,必须靠这个上限兜住。
          DEADLINE=$((SECONDS + 300))
          BLIND=0
          STATUS=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            JSON=$(api_get "pages/builds/latest")
            STATUS=$(printf '%s' "$JSON" | jq -r '.status // ""' 2>/dev/null)
            SHA=$(printf '%s' "$JSON" | jq -r '.commit // ""' 2>/dev/null)
            ERRMSG=$(printf '%s' "$JSON" | jq -r '.error.message // ""' 2>/dev/null)

            if [ -z "$STATUS" ]; then
              BLIND=$((BLIND + 1))
              echo "[pages-verify] 第 $BLIND 次读不到构建状态,稍后重试…"
              # 连续读不到多半是权限/限流问题,不能因此把正常部署判死。
              if [ "$BLIND" -ge 8 ]; then
                echo "::warning::[pages-verify] 连续 8 次读不到 Pages 构建状态,跳过校验。请确认 PAGES_DEPLOY_TOKEN 能读取发布仓 Pages 信息。"
                exit 0
              fi
              sleep 15
              continue
            fi
            BLIND=0

            if [ "$SHA" != "$TARGET" ]; then
              echo "[pages-verify] 等待新构建进入队列(最新仍是 ${SHA:0:8} / $STATUS)…"
              sleep 15
              continue
            fi

            case "$STATUS" in
              built)
                echo "[pages-verify] ✅ Pages 构建完成:${SHA:0:8}"
                exit 0
                ;;
              errored)
                echo "::error::[pages-verify] Pages 构建失败:${SHA:0:8} — ${ERRMSG:-未知原因}"
                RUNINFO=$(api_get "actions/workflows/pages-build-deployment/runs?per_page=1" \
                  | jq -r '.workflow_runs[0] | "[pages-verify] 失败运行:\(.html_url)(\(.conclusion))"' 2>/dev/null)
                [ -n "$RUNINFO" ] && echo "$RUNINFO"
                echo "[pages-verify] 常见原因:上一次部署残留 in-progress 锁,新部署创建时被 400 拒绝。"
                echo "[pages-verify] 处理:gh run rerun <运行 ID> --repo $PUBLISH_REPO --failed"
                exit 1
                ;;
              *)
                echo "[pages-verify] 构建中($STATUS)…"
                sleep 15
                ;;
            esac
          done

          echo "::error::[pages-verify] 等待 5 分钟仍未完成,Pages 构建疑似卡死(最后状态:${STATUS:-unknown})。"
          echo "[pages-verify] 站点仍是旧版本,请检查发布仓 pages build and deployment 的运行记录。"
          exit 1
