name: Deploy Blog From Source

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  # 由发布仓的 comment-email-notify 在收到新评论时触发,
  # 让构建重新查询 Giscus discussions,刷新碎碎念/文章的 commentCount(评论区自动展开)。
  repository_dispatch:
    types: [rebuild-on-comment]

jobs:
  deploy:
    if: github.repository != 'SpeechlessPanda/SpeechlessPanda.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          # 需要完整历史，供下一步按 git 提交时间恢复文件 mtime
          fetch-depth: 0

      # checkout 会把所有文件 mtime 设为 checkout 时间，导致 Hexo(updated_option: mtime)
      # 把每篇文章的 updated 都当成构建时间。主题 feed 生成器的"旧文更新推送"
      # 依赖真实的 updated，这里按每个文件最后一次提交时间恢复 mtime。
      - name: Restore file mtimes from git history
        shell: bash
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            [ -n "$t" ] && touch -d "@$t" "$f"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 26：2026-10-28 起为 Active LTS（此前为 Current）。
          # 选它而非 24 的理由：24 已于 2026-10-20 转入 Maintenance（只修关键缺陷），
          # 26 是新 LTS 线且 EOL 到 2029-04；22 为旧维护线。
          # 注意这里指定的是「构建用的 Node」，与 action 自身 runtime 无关。
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache OG image fonts
        uses: actions/cache@v6
        with:
          path: fonts
          key: og-fonts-${{ hashFiles('_config.yml') }}

      - name: Build static site
        env:
          GH_DISCUSSION_TOKEN: ${{ secrets.GH_DISCUSSION_TOKEN }}
        run: pnpm run build
      - name: Verify atom feed identity
        # atom.xml 条目身份标识校验（link/id 唯一性、碎碎念路径式地址），失败即中断部署
        run: node tools/verify-feed.js


      - name: Sync README to publish directory
        shell: bash
        run: |
          if [[ -f README.md ]]; then
            cp README.md public/README.md
            echo "[readme-sync] Synced README.md to public/README.md"
          else
            echo "::warning::[readme-sync] Missing README.md in repository root"
          fi

      - name: Deploy to GitHub Pages repository
        # 锁定到 v4.1.0（浮动 v4 tag 实际也指向它，但显式写出版本可避免
        # 未来 tag 漂移）。v4.1.0 已是 node24 runtime；更早的 v4.0.0 是 node20，
        # 会触发 GitHub 弃用警告。该action 依赖 git config 中的 personal_token
        # 推送，与 checkout v6+ 的凭证隔离($RUNNER_TEMP)配合需保持 git 可用。
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: SpeechlessPanda/SpeechlessPanda.github.io
          publish_branch: main
          publish_dir: ./public
          # 默认 exclude_assets=.github 会丢掉 public/.github/workflows;改为空,
          # 让 sync 脚本同步过来的 comment-email-notify / search-engine-ping 真正进发布仓激活
          # (它们都用 if: github.repository=='SpeechlessPanda/SpeechlessPanda.github.io' 守卫,只在发布仓跑)。
          exclude_assets: ""
          enable_jekyll: false
          force_orphan: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
