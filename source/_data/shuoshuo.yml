    书接着往后翻，之前认为 cpp 暂时还能高枕无忧的还是浅薄了。前面看到的现代化语言之所以还没取代 cpp ，没有和 cpp 一流的互操作性也是一个很大影响因素，这使团队无法丝滑地从 cpp 迁移到其他语言。但谷歌最近开发的 Carbon 解决了这个痛点，甚至重点就是和 cpp 一流的互操作性，以取代 cpp 。如果这门语言最终做的够好，说不定几年之后 cpp 也会日薄西山。但也不好说，其他语言没有与 cpp 一流的互操作可能也是因为这玩意东西太多了，压根做不出来吧。 
